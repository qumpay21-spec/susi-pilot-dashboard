# Render blueprint (https://render.com/docs/blueprint-spec).
# One web service: builds the Nuxt frontend as static files, builds the NestJS API,
# and the API serves both the frontend and /api from the same URL.
services:
  - type: web
    name: susi-pilot-portal
    runtime: node
    plan: free
    buildCommand: >-
      cd frontend && npm ci && npm run generate &&
      cd ../backend && npm ci && npm run build
    startCommand: cd backend && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
