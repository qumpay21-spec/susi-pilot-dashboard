# Render blueprint for the API (https://render.com/docs/blueprint-spec).
# The frontend is a static site and can go to Vercel, Netlify or Render Static Sites.
services:
  - type: web
    name: susi-pilot-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: CORS_ORIGIN
        sync: false
